# Mantém o Supabase (plano gratuito) acordado.
# O projeto pausa após 7 dias sem uso; esta rotina faz uma consulta leve a cada 3 dias,
# na nuvem do GitHub — não depende do seu computador estar ligado.
name: Manter Supabase acordado

on:
  schedule:
    - cron: "17 12 */3 * *"   # a cada 3 dias, 09:17 de Brasília
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPA_URL: https://ytehtjgbxkwpfabqhojm.supabase.co
          # Chave pública (anon), a mesma que já está no site
          SUPA_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZWh0amdieGt3cGZhYnFob2ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNDkyOTYsImV4cCI6MjA5MzgyNTI5Nn0.SeToYeh4Fbbz4xUvoY2iF1ZQ5av70IJC3TCjzIEwowE
        run: |
          curl -fsS --retry 3 --retry-delay 20 \
            "$SUPA_URL/rest/v1/articles?select=id&limit=1" \
            -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY"
          echo
          echo "Supabase respondeu ✅"
