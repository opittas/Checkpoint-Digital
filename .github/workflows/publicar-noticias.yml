# Publica no site as notícias novas do banco (Supabase), 3x por dia.
# Gera a página fixa de cada notícia (prévia no WhatsApp/Discord/X e Google),
# completa os jogos novos do catálogo (capa e conquistas da Steam),
# baixa as capas e atualiza o mapa do site. Roda na nuvem do GitHub.
name: Publicar notícias

on:
  schedule:
    - cron: "40 9,15,23 * * *"   # 06:40, 12:40 e 20:40 (Brasília)
  workflow_dispatch:             # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar páginas a partir do banco
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pip install --quiet certifi
          python3 ferramentas/atualizar_site.py --so-gerar

      - name: Publicar se houver novidade
        run: |
          git config user.name "Checkpoint Digital (automático)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data noticias conquistas imagens sitemap.xml robots.txt *.html
          if git diff --cached --quiet; then
            echo "Nenhuma notícia nova."
            exit 0
          fi
          git commit -m "Notícias: atualização automática $(date -u +'%d/%m/%Y %H:%M') UTC"
          git push
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
