<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Guias de Conquistas e Troféus — Checkpoint Digital</title>
<!--SEO-->
<meta name="description" content="Listas oficiais de conquistas com % de jogadores, roteiros para platinar e checklist salvo na sua conta.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://opittas.github.io/Checkpoint-Digital/conquistas.html">
<meta property="og:site_name" content="Checkpoint Digital">
<meta property="og:locale" content="pt_BR">
<meta property="og:type" content="website">
<meta property="og:title" content="Guias de Conquistas e Troféus — Checkpoint Digital">
<meta property="og:description" content="Listas oficiais de conquistas com % de jogadores, roteiros para platinar e checklist salvo na sua conta.">
<meta property="og:url" content="https://opittas.github.io/Checkpoint-Digital/conquistas.html">
<meta property="og:image" content="https://opittas.github.io/Checkpoint-Digital/imagens/og-padrao.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Guias de Conquistas e Troféus — Checkpoint Digital">
<meta name="twitter:description" content="Listas oficiais de conquistas com % de jogadores, roteiros para platinar e checklist salvo na sua conta.">
<meta name="twitter:image" content="https://opittas.github.io/Checkpoint-Digital/imagens/og-padrao.jpg">
<!--/SEO-->
<meta name="description" content="Guias de conquistas e troféus com checklist de progresso, raridade e roteiro para platinar.">
<link rel="stylesheet" href="shared.css?v=cc0e673f">
<link rel="stylesheet" href="conquistas-app.css?v=3b11cbda">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="ck-hero">
  <div class="ck-wrap">
    <div class="ck-eyebrow" id="t-eyebrow">🏆 Guias de Conquistas</div>
    <h1 id="t-title">Acompanhe sua caçada às platinas</h1>
    <p id="t-sub">Listas oficiais com a porcentagem de jogadores que desbloqueou cada conquista, roteiro para platinar e um checklist que fica salvo no seu navegador.</p>
    <div class="ck-stats" id="hero-stats"></div>
    <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap">
      <button class="ck-btn" id="btn-export">⬇️ <span>Baixar backup do progresso</span></button>
      <button class="ck-btn" id="btn-import">⬆️ <span>Restaurar backup</span></button>
      <input type="file" id="file-import" accept="application/json" hidden>
    </div>
  </div>
</section>

<div class="ck-toolbar">
  <div class="ck-toolbar-inner">
    <label class="ck-search">🔎 <input id="q" type="search" placeholder="Buscar jogo…" autocomplete="off"></label>
    <div class="ck-chips" id="plat-chips"></div>
    <select class="ck-select" id="sort"></select>
  </div>
</div>

<main class="ck-wrap">
  <div class="ck-grid" id="grid">
    <div class="ck-empty"><div class="ck-spinner"></div><span id="t-loading">Carregando jogos…</span></div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js?v=da7f87e4"></script>
<script src="conquistas-app.js?v=70ef7666"></script>
<script src="auth.js?v=2cd7afc5"></script>
<script>
  renderHeader('ach');
  renderFooter();
  const T = CK.tr;

  // Textos fixos
  if (CK.isEN()) {
    document.getElementById('t-eyebrow').textContent = '🏆 Achievement Guides';
    document.getElementById('t-title').textContent = 'Track your platinum hunt';
    document.getElementById('t-sub').textContent = 'Official lists with the share of players who unlocked each achievement, a roadmap to 100% and a checklist saved in your browser.';
    document.getElementById('q').placeholder = 'Search game…';
    document.querySelector('#btn-export span').textContent = 'Download progress backup';
    document.querySelector('#btn-import span').textContent = 'Restore backup';
    document.getElementById('t-loading').textContent = 'Loading games…';
  }

  const PLATS = [['all', T('Todos', 'All')], ['xbox', 'Xbox'], ['ps', 'PlayStation'], ['nin', 'Nintendo'], ['steam', 'Steam']];
  const SORTS = [
    ['az', T('Ordem A–Z', 'A–Z')],
    ['progress', T('Meu progresso', 'My progress')],
    ['easy', T('Mais fáceis', 'Easiest')],
    ['hard', T('Mais difíceis', 'Hardest')],
    ['count', T('Mais conquistas', 'Most achievements')],
    ['new', T('Mais recentes', 'Newest')],
  ];
  const state = { plat: 'all', q: '', sort: 'az' };
  try { Object.assign(state, JSON.parse(sessionStorage.getItem('ck_list_state')) || {}); } catch (e) {}

  let games = [], index = {};

  // Porcentagem = só jogo base; DLCs têm progresso próprio
  function gameStats(j) {
    const gp = CK.gameProgress(j.id, index);
    const dlcFeitas = gp.dlcs.reduce((s, d) => s + d.feitas, 0);
    return { total: gp.base.total, done: gp.base.feitas, pct: gp.base.pct, dlcs: gp.dlcs,
             tudo: (index[j.id] || {}).total || 0, marcadas: gp.base.feitas + dlcFeitas };
  }

  function renderStats() {
    let totalAch = 0, marked = 0, started = 0, finished = 0;
    games.forEach(j => {
      const s = gameStats(j);
      totalAch += s.tudo; marked += s.marcadas;
      if (s.done > 0) started++;
      if (s.total && s.done >= s.total) finished++;
    });
    const items = [
      [games.length, T('Jogos', 'Games')],
      [totalAch.toLocaleString(CK.isEN() ? 'en' : 'pt-BR'), T('Conquistas catalogadas', 'Achievements listed')],
      [marked, T('Marcadas por você', 'Marked by you')],
      [`${started}${finished ? ' · ' + finished + ' 🏆' : ''}`, T('Jogos em andamento', 'Games in progress')],
    ];
    document.getElementById('hero-stats').innerHTML =
      items.map(([b, s]) => `<div class="ck-stat"><b>${b}</b><span>${s}</span></div>`).join('');
  }

  function renderChips() {
    document.getElementById('plat-chips').innerHTML = PLATS.map(([id, lbl]) => {
      const n = id === 'all' ? games.length : games.filter(g => g.platforms.includes(id)).length;
      return `<button class="ck-chip${state.plat === id ? ' on' : ''}" data-plat="${id}">${lbl}<span class="n">${n}</span></button>`;
    }).join('');
    const sel = document.getElementById('sort');
    sel.innerHTML = SORTS.map(([v, l]) => `<option value="${v}"${state.sort === v ? ' selected' : ''}>${l}</option>`).join('');
    document.getElementById('q').value = state.q;
  }

  function card(j) {
    const s = gameStats(j);
    const href = `conquistas/${encodeURIComponent(j.id)}.html`;
    let foot;
    if (j.mode === 'sem-conquistas') {
      foot = `<div class="ck-card-foot-row"><span>${T('Sem sistema de conquistas', 'No achievement system')}</span><b>${T('Ver detalhes →', 'Details →')}</b></div>`;
    } else {
      const label = j.mode === 'checklist' ? T('metas', 'goals') : T('conquistas', 'achievements');
      const dlcTxt = s.dlcs.length ? `<span class="ck-dlc-pill" title="${CK.esc(s.dlcs.map(d => d.nome).join(', '))}">＋ ${s.dlcs.length} DLC${s.dlcs.length > 1 ? 's' : ''}</span>` : '';
      foot = `
        <div class="ck-bar"><div style="width:${s.pct}%"></div></div>
        <div class="ck-card-foot-row">
          <span>${s.total ? `${s.done}/${s.total} ${label}${s.dlcs.length ? ' · ' + T('base', 'base') : ''}` : T('Lista em atualização', 'List updating')} ${dlcTxt}</span>
          <b>${s.done ? s.pct + '%' : T('Começar →', 'Start →')}</b>
        </div>`;
    }
    const badge = s.total && s.done >= s.total
      ? `<span class="ck-cover-badge done">🏆 ${T('Completo', 'Completed')}</span>`
      : (s.done ? `<span class="ck-cover-badge">${s.pct}%</span>` : '');
    const meta = [
      j.difficulty ? `<span>${CK.diffMeter(j.difficulty)} ${j.difficulty}/10</span>` : '',
      j.hours ? `<span>⏱ ${j.hours}</span>` : '',
      j.online ? `<span>🌐 Online</span>` : '',
    ].join('');
    return `
      <a class="ck-card" href="${href}">
        <div class="ck-cover">
          <button class="ck-libbtn${CK.inLib(j.id) ? ' on' : ''}" data-lib="${CK.esc(j.id)}" title="${CK.inLib(j.id) ? T('Nos Meus Jogos', 'In My Games') : T('Adicionar aos Meus Jogos', 'Add to My Games')}">${CK.inLib(j.id) ? '✓' : '＋'}</button>
          <div class="ck-fallback">🎮</div>
          <img src="${CK.imgSrc(j.image)}" alt="${CK.esc(j.title)}" loading="lazy" onerror="this.remove()">
          ${badge}
        </div>
        <div class="ck-card-body">
          <div>
            <div class="ck-card-title">${CK.esc(j.title)}</div>
            <div class="ck-card-dev">${CK.esc(j.developer)} · ${j.year}</div>
          </div>
          <div class="ck-plats">${CK.platBadges(j)}</div>
          <div class="ck-meta">${meta}</div>
          <div class="ck-card-foot">${foot}</div>
        </div>
      </a>`;
  }

  function renderGrid() {
    sessionStorage.setItem('ck_list_state', JSON.stringify(state));
    const q = CK.norm(state.q);
    let list = games.filter(j =>
      (state.plat === 'all' || j.platforms.includes(state.plat)) &&
      (!q || CK.norm(j.title + ' ' + j.developer).includes(q)));
    const cmp = {
      az: (a, b) => a.title.localeCompare(b.title),
      progress: (a, b) => gameStats(b).pct - gameStats(a).pct || a.title.localeCompare(b.title),
      easy: (a, b) => (a.difficulty || 99) - (b.difficulty || 99),
      hard: (a, b) => (b.difficulty || 0) - (a.difficulty || 0),
      count: (a, b) => gameStats(b).total - gameStats(a).total,
      new: (a, b) => b.year - a.year,
    }[state.sort];
    list.sort(cmp);
    document.getElementById('grid').innerHTML = list.length
      ? list.map(card).join('')
      : `<div class="ck-empty"><div class="big">🕹️</div>${T('Nenhum jogo encontrado.', 'No games found.')}</div>`;
  }

  // Eventos
  document.getElementById('grid').addEventListener('click', e => {
    const b = e.target.closest('[data-lib]'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    const j = games.find(g => g.id === b.dataset.lib);
    if (CK.inLib(j.id)) { location.href = 'meus-jogos.html'; return; }
    CK.setLibItem(j.id, { plataformas: j.platforms.length === 1 ? j.platforms.slice() : [], status: 'jogando', favorito: false, origem: 'manual' });
    b.classList.add('on'); b.textContent = '✓'; b.title = T('Nos Meus Jogos', 'In My Games');
    CK.toast(T(`${j.title} adicionado aos Meus Jogos`, `${j.title} added to My Games`));
  });
  document.getElementById('plat-chips').addEventListener('click', e => {
    const b = e.target.closest('[data-plat]'); if (!b) return;
    state.plat = b.dataset.plat; renderChips(); renderGrid();
  });
  document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; renderGrid(); });
  document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; renderGrid(); });

  document.getElementById('btn-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ site: 'checkpoint-digital', data: new Date().toISOString(), progresso: CK.exportAll() }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'checkpoint-progresso.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-import').click());
  document.getElementById('file-import').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const obj = JSON.parse(await f.text());
      const n = CK.importAll(obj.progresso || obj);
      CK.toast(T(`Progresso de ${n} jogo(s) restaurado`, `Restored progress for ${n} game(s)`));
      renderStats(); renderGrid();
    } catch (err) { CK.toast(T('Arquivo inválido', 'Invalid file')); }
    e.target.value = '';
  });

  Promise.all([CK.loadGames(), CK.loadIndex(), window.CK_AUTH ? CK_AUTH.sincronizarRapido() : null]).then(([g, idx]) => {
    games = g; index = idx || {};
    renderStats(); renderChips(); renderGrid();
  }).catch(() => {
    document.getElementById('grid').innerHTML =
      `<div class="ck-empty"><div class="big">⚠️</div>${T('Não foi possível carregar os jogos.', 'Could not load games.')}</div>`;
  });
</script>
</body>
</html>
