<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Checkpoint Digital — Notícias, reviews e guias de conquistas</title>
<!--SEO-->
<meta name="description" content="Notícias de Xbox, PlayStation, Nintendo e PC, reviews e guias de conquistas com checklist de progresso.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://opittas.github.io/Checkpoint-Digital/">
<meta property="og:site_name" content="Checkpoint Digital">
<meta property="og:locale" content="pt_BR">
<meta property="og:type" content="website">
<meta property="og:title" content="Checkpoint Digital — Notícias, reviews e guias de conquistas">
<meta property="og:description" content="Notícias de Xbox, PlayStation, Nintendo e PC, reviews e guias de conquistas com checklist de progresso.">
<meta property="og:url" content="https://opittas.github.io/Checkpoint-Digital/">
<meta property="og:image" content="https://opittas.github.io/Checkpoint-Digital/imagens/og-padrao.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Checkpoint Digital — Notícias, reviews e guias de conquistas">
<meta name="twitter:description" content="Notícias de Xbox, PlayStation, Nintendo e PC, reviews e guias de conquistas com checklist de progresso.">
<meta name="twitter:image" content="https://opittas.github.io/Checkpoint-Digital/imagens/og-padrao.jpg">
<!--/SEO-->
<link rel="stylesheet" href="shared.css?v=cc0e673f">
<style>
  /* ── HOME HERO ── */
  .hero {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 48px 0 40px;
    transition: var(--theme-transition);
  }
  .hero-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 24px;
    display: grid; grid-template-columns: 1fr 340px; gap: 32px; align-items: start;
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; padding: 4px 10px; border-radius: 20px; margin-bottom: 14px;
  }
  .hero-tag.xbox  { background: var(--xbox-light);  color: var(--xbox-dark); }
  .hero-tag.ps    { background: var(--ps-light);    color: var(--ps-dark); }
  .hero-tag.nin   { background: var(--nin-light);   color: var(--nin-dark); }
  .hero-tag.steam { background: var(--steam-light); color: var(--steam-dark); }
  .hero-title { font-size: 28px; font-weight: 700; line-height: 1.3; color: var(--text); margin-bottom: 12px; }
  .hero-meta { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ── SIDE NEWS ── */
  .side-news { display: flex; flex-direction: column; gap: 0; }
  .side-news-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-bottom: 12px; }
  .side-item { padding: 12px 0; border-bottom: 1px solid var(--border); transition: opacity 0.15s; text-decoration: none; display: block; }
  .side-item:last-child { border-bottom: none; }
  .side-item:hover { opacity: 0.7; }
  .side-item-plat { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
  .side-item-plat.xbox  { color: var(--xbox); }
  .side-item-plat.ps    { color: var(--ps); }
  .side-item-plat.nin   { color: var(--nin); }
  .side-item-plat.steam { color: var(--steam); }
  .side-item-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 3px; }
  .side-item-date  { font-size: 11px; color: var(--text3); }

  /* ── HOME PLATFORM SECTIONS ── */
  .home-sections { padding: 40px 0; }
  .home-plat-section { margin-bottom: 40px; }
  .home-plat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
  .home-plat-name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .plat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .plat-dot.xbox  { background: var(--xbox); }
  .plat-dot.ps    { background: var(--ps); }
  .plat-dot.nin   { background: var(--nin); }
  .plat-dot.steam { background: var(--steam); }
  .see-all-btn {
    font-size: 12px; font-weight: 600;
    background: none; border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 6px; cursor: pointer; transition: all 0.15s;
    text-decoration: none;
  }
  .see-all-btn:hover { border-color: var(--text3); color: var(--text); }
  .see-all-btn.xbox  { color: var(--xbox);  border-color: var(--xbox); }
  .see-all-btn.ps    { color: var(--ps);    border-color: var(--ps); }
  .see-all-btn.nin   { color: var(--nin);   border-color: var(--nin); }
  .see-all-btn.steam { color: var(--steam); border-color: var(--steam); }

  /* Skeleton / loading */
  .home-skeleton { grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }

  /* Hero loading */
  .hero-loading { color: var(--text3); font-size: 14px; padding: 20px 0; }

  @media (max-width: 768px) {
    .hero-inner { grid-template-columns: 1fr; }
    .side-news  { display: none; }
  }
</style>
</head>
<body>

<header class="site-header" id="site-header"></header>

<!-- ── HERO ── -->
<div class="hero">
  <div class="hero-inner">
    <div id="hero-main"><div class="hero-loading"><div class="spinner"></div></div></div>
    <aside class="side-news">
      <div class="side-news-title" id="t-side">Últimas notícias</div>
      <div id="side-news-list" style="color:var(--text3);font-size:13px"></div>
    </aside>
  </div>
</div>

<!-- ── SEÇÕES POR PLATAFORMA (montadas a partir de data/site.json) ── -->
<div class="home-sections">
  <div class="wrapper" id="home-sections"></div>
</div>

<footer id="site-footer"></footer>
<script src="shared.js?v=da7f87e4"></script>
<script>
  renderHeader('home');
  renderFooter();
  document.getElementById('t-side').textContent = L('Últimas notícias', 'Latest news');

  function heroHTML(a, site) {
    const p = site.porId[a.platform] || { emoji: '📰', nome: '' };
    return `
      <div class="hero-tag ${escHTML(a.platform)}">${p.emoji} ${escHTML(p.nome)} · ${L('Destaque', 'Spotlight')}</div>
      <h1 class="hero-title">${escHTML(t(a, 'title'))}</h1>
      <div class="hero-meta">
        <span>${fmtDate(a.published_at)}</span>
        <span class="hero-dot"></span>
        <span>${escHTML(a.read_time || '3 min')} ${L('de leitura', 'read')}</span>
        <span class="badge ${catBadge(site, a.category)}">${escHTML(catLabel(site, a.category))}</span>
      </div>
      <p class="hero-excerpt">${escHTML(t(a, 'excerpt'))}</p>
      <a class="hero-btn" href="noticias/${encodeURIComponent(a.id)}.html">${L('Ler artigo completo →', 'Read full article →')}</a>`;
  }

  function sideHTML(a, site) {
    const p = site.porId[a.platform] || { emoji: '📰', nome: '' };
    return `
      <a href="noticias/${encodeURIComponent(a.id)}.html" class="side-item">
        <div class="side-item-plat ${escHTML(a.platform)}">${p.emoji} ${escHTML(p.nome)}</div>
        <div class="side-item-title">${escHTML(t(a, 'title'))}</div>
        <div class="side-item-date">${fmtDate(a.published_at)}</div>
      </a>`;
  }

  function secaoHTML(p, arts, site) {
    const cards = arts.length
      ? arts.map(a => newsCardHTML(a, site)).join('')
      : `<div class="home-skeleton" style="font-style:italic">${L('Nenhuma notícia ainda nesta plataforma.', 'No news on this platform yet.')}</div>`;
    return `
      <div class="home-plat-section">
        <div class="home-plat-header">
          <div class="home-plat-name"><span class="plat-dot ${p.id}"></span> ${escHTML(p.nome)}</div>
          <a class="see-all-btn ${p.id}" href="${p.pagina}">${L('Ver tudo →', 'See all →')}</a>
        </div>
        <div class="cards-grid">${cards}</div>
      </div>`;
  }

  Promise.all([loadSite(), dbFetch('articles?order=published_at.desc').then(r => r.json())])
    .then(([site, arts]) => {
      arts = Array.isArray(arts) ? arts : [];
      if (!arts.length) {
        document.getElementById('hero-main').innerHTML = `<p style="color:var(--text3)">${L('Nenhum artigo publicado ainda.', 'No articles published yet.')}</p>`;
        return;
      }
      const destaque = arts.find(a => a.featured === true || a.featured === 'true') || arts[0];
      document.getElementById('hero-main').innerHTML = heroHTML(destaque, site);
      document.getElementById('side-news-list').innerHTML =
        arts.filter(a => a.id !== destaque.id).slice(0, 5).map(a => sideHTML(a, site)).join('');
      document.getElementById('home-sections').innerHTML = site.plataformas
        .map(p => secaoHTML(p, arts.filter(a => a.platform === p.id).slice(0, 3), site)).join('');
    })
    .catch(e => {
      document.getElementById('hero-main').innerHTML =
        `<p style="color:#dc2626">⚠️ ${L('Erro ao carregar notícias.', 'Could not load news.')}</p>`;
    });
</script>
</body>
</html>
